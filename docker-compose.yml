services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-decision-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_decision}
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-finance_decision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: finance-decision-backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-finance_decision}
      FILE_STORAGE_PATH: /app/storage
      FIXTURES_PATH: /fixtures
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
